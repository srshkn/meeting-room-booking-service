name: CI

on:
  push:
    branches-ignore:
      - main
      - release
    paths-ignore:
      - README.md
      - LICENSE
      - .env.example
      - .version
      - docs/**
      - api/*
      - .gitignore
      - .dockerignore

  pull_request:
    branches: [main, develop]

jobs:
  checks-go:
    runs-on: ubuntu-latest

    env:
      CONFIG_PREFIX: TEST
      TEST_SERVER_HOST: ${{ secrets.TEST_SERVER_HOST }}
      TEST_SERVER_PORT: ${{ secrets.TEST_SERVER_PORT }}
      TEST_SERVER_SHUTDOWN_TIMEOUT: ${{ secrets.TEST_SERVER_SHUTDOWN_TIMEOUT }}

      TEST_LOGGER_FORMAT: ${{ secrets.TEST_LOGGER_FORMAT }}

      TEST_DB_HOST: ${{ secrets.TEST_DB_HOST }}
      TEST_DB_PORT: ${{ secrets.TEST_DB_PORT }}
      TEST_DB_USER: ${{ secrets.TEST_DB_USER }}
      TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
      TEST_DB_NAME: ${{ secrets.TEST_DB_NAME }}
      TEST_DB_MAX_OPEN_CONNS: ${{ secrets.TEST_DB_MAX_OPEN_CONNS }}
      TEST_DB_MIN_OPEN_CONNS: ${{ secrets.TEST_DB_MIN_OPEN_CONNS }}
      TEST_DB_CONN_MAX_LIFETIME: ${{ secrets.TEST_DB_CONN_MAX_LIFETIME }}
      TEST_DB_MAX_CONN_IDLE_TIME: ${{ secrets.TEST_DB_MAX_CONN_IDLE_TIME }}

      JWT_PATH_PRIVATE_KEY: "${{ github.workspace }}/${{ secrets.TEST_JWT_PATH_PRIVATE_KEY }}"
      JWT_PATH_PUBLIC_KEY: "${{ github.workspace }}/${{ secrets.TEST_JWT_PATH_PUBLIC_KEY }}"

      TEST_JWT_ACCESS_EXPIRES: ${{ secrets.TEST_JWT_ACCESS_EXPIRES }}
      TEST_JWT_REFRESH_EXPIRES: ${{ secrets.TEST_JWT_REFRESH_EXPIRES }}
      TEST_JWT_ISSUER: ${{ secrets.TEST_JWT_ISSUER }}
      TEST_JWT_AUDIENCE: ${{ secrets.TEST_JWT_AUDIENCE }}

      TEST_CORS_ALLOWED_ORIGINS: ${{ secrets.TEST_CORS_ALLOWED_ORIGINS }}
      TEST_CORS_ALLOWED_METHODS: ${{ secrets.TEST_CORS_ALLOWED_METHODS }}
      TEST_CORS_ALLOWED_HEADERS: ${{ secrets.TEST_CORS_ALLOWED_HEADERS }}
      TEST_CORS_ALLOW_CREDENTIALS: ${{ secrets.TEST_CORS_ALLOW_CREDENTIALS }}

      TEST_COOKIE_REFRESH_TOKEN_NAME: ${{ secrets.TEST_COOKIE_REFRESH_TOKEN_NAME }}
      TEST_COOKIE_PATH: ${{ secrets.TEST_COOKIE_PATH }}
      TEST_COOKIE_DOMAIN: ""
      TEST_COOKIE_SECURE: ${{ secrets.TEST_COOKIE_SECURE }}
      TEST_COOKIE_HTTP_ONLY: ${{ secrets.TEST_COOKIE_HTTP_ONLY }}
      TEST_COOKIE_STRING_SAME_SITE: ${{ secrets.TEST_COOKIE_STRING_SAME_SITE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create JWT keys
        run: |
          mkdir -p "$(dirname "$JWT_PATH_PRIVATE_KEY")"
          mkdir -p "$(dirname "$JWT_PATH_PUBLIC_KEY")"

          printf '%s\n' "${{ secrets.TEST_JWT_PRIVATE_KEY }}" > "$JWT_PATH_PRIVATE_KEY"
          printf '%s\n' "${{ secrets.TEST_JWT_PUBLIC_KEY }}" > "$JWT_PATH_PUBLIC_KEY"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"

          if [[ -n "$files" ]]; then
            echo "These files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

  checks-dockerfile:
    needs: checks-go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Dockerfile
        run: docker build --check -f Dockerfile .

      - name: Build Docker image
        run: docker build -f Dockerfile -t mrb-service:ci .


  checks-compose:
    needs: checks-dockerfile
    runs-on: ubuntu-latest

    env:
      CONFIG_PREFIX:

      SERVER_HOST: ${{ secrets.TEST_SERVER_HOST }}
      SERVER_PORT: ${{ secrets.TEST_SERVER_PORT }}
      SERVER_SHUTDOWN_TIMEOUT: ${{ secrets.TEST_SERVER_SHUTDOWN_TIMEOUT }}

      LOGGER_FORMAT: ${{ secrets.TEST_LOGGER_FORMAT }}

      DB_HOST: ${{ secrets.TEST_DB_HOST }}
      DB_PORT: ${{ secrets.TEST_DB_PORT }}
      DB_USER: ${{ secrets.TEST_DB_USER }}
      DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
      DB_NAME: ${{ secrets.TEST_DB_NAME }}
      DB_MAX_OPEN_CONNS: ${{ secrets.TEST_DB_MAX_OPEN_CONNS }}
      DB_MIN_OPEN_CONNS: ${{ secrets.TEST_DB_MIN_OPEN_CONNS }}
      DB_CONN_MAX_LIFETIME: ${{ secrets.TEST_DB_CONN_MAX_LIFETIME }}
      DB_MAX_CONN_IDLE_TIME: ${{ secrets.TEST_DB_MAX_CONN_IDLE_TIME }}

      JWT_PATH_PRIVATE_KEY: "${{ secrets.TEST_JWT_PATH_PRIVATE_KEY }}"
      JWT_PATH_PUBLIC_KEY: "${{ secrets.TEST_JWT_PATH_PUBLIC_KEY }}"

      JWT_ACCESS_EXPIRES: ${{ secrets.TEST_JWT_ACCESS_EXPIRES }}
      JWT_REFRESH_EXPIRES: ${{ secrets.TEST_JWT_REFRESH_EXPIRES }}
      JWT_ISSUER: ${{ secrets.TEST_JWT_ISSUER }}
      JWT_AUDIENCE: ${{ secrets.TEST_JWT_AUDIENCE }}

      CORS_ALLOWED_ORIGINS: ${{ secrets.TEST_CORS_ALLOWED_ORIGINS }}
      CORS_ALLOWED_METHODS: ${{ secrets.TEST_CORS_ALLOWED_METHODS }}
      CORS_ALLOWED_HEADERS: ${{ secrets.TEST_CORS_ALLOWED_HEADERS }}
      CORS_ALLOW_CREDENTIALS: ${{ secrets.TEST_CORS_ALLOW_CREDENTIALS }}

      COOKIE_REFRESH_TOKEN_NAME: ${{ secrets.TEST_COOKIE_REFRESH_TOKEN_NAME }}
      COOKIE_PATH: ${{ secrets.TEST_COOKIE_PATH }}
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: ${{ secrets.TEST_COOKIE_SECURE }}
      COOKIE_HTTP_ONLY: ${{ secrets.TEST_COOKIE_HTTP_ONLY }}
      COOKIE_STRING_SAME_SITE: ${{ secrets.TEST_COOKIE_STRING_SAME_SITE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create JWT keys
        run: |
          mkdir -p ./secrets

              printf '%s\n' "${{ secrets.TEST_JWT_PRIVATE_KEY }}" \
                > ./secrets/test-private.pem

              printf '%s\n' "${{ secrets.TEST_JWT_PUBLIC_KEY }}" \
                > ./secrets/test-public.pem

      - name: Validate Compose
        run: |
          docker compose \
            -f compose.yml \
            -f infra/compose/dev.yml \
            config --quiet

      - name: Start Compose
        run: |
          docker compose \
            -f compose.yml \
            -f infra/compose/dev.yml \
            up -d --build

      - name: Check health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:${SERVER_PORT}/api/v1/health; then
              exit 0
            fi

            sleep 2
          done

          docker compose \
            -f compose.yml \
            -f infra/compose/dev.yml \
            logs --no-color

          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker compose \
            -f compose.yml \
            -f infra/compose/dev.yml \
            down -v --remove-orphans

  checks-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME }}
          POSTGRES_USER: ${{ secrets.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ secrets.TEST_DB_USER }} -d ${{ secrets.TEST_DB_NAME }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply migrations
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/db/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 \
            -path /migrations \
            -database "postgres://${{ secrets.TEST_DB_USER }}:${{ secrets.TEST_DB_PASSWORD }}@127.0.0.1:5432/${{ secrets.TEST_DB_NAME }}?sslmode=disable" \
            up

      - name: Roll back migrations
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/db/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 \
            -path /migrations \
            -database "postgres://${{ secrets.TEST_DB_USER }}:${{ secrets.TEST_DB_PASSWORD }}@127.0.0.1:5432/${{ secrets.TEST_DB_NAME }}?sslmode=disable" \
            down -all

      - name: Reapply migrations
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/db/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 \
            -path /migrations \
            -database "postgres://${{ secrets.TEST_DB_USER }}:${{ secrets.TEST_DB_PASSWORD }}@127.0.0.1:5432/${{ secrets.TEST_DB_NAME }}?sslmode=disable" \
            up